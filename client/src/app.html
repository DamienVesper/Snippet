<!doctype html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Snippet</title>
        <meta name="description" content="A custom file uploader." />
        <meta name="keywords" content="" />
        <meta name="robots" content="noindex" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://domain.tld" />
        <meta property="og:title" content="Snippet" />
        <meta property="og:description" content="A custom file uploader." />
        <meta property="og:site_name" content="domain.tld" />
        <meta property="og:image" content="/favicon.ico" />
        <meta property="og:image:alt" content="Snippet logo" />
        <meta property="og:locale" content="en_US" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Snippet" />
        <meta name="twitter:description" content="A custom file uploader." />
        <meta name="twitter:image" content="/favicon.ico" />

        <link rel="canonical" href="https://domain.tld" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
