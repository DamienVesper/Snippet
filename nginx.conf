server {
    listen 443 ssl;
    http2 on;

    server_name example.domain.tld;

    location / {
        proxy_http_version 1.1;
        include proxy_params;

        proxy_pass "http://127.0.0.1:4567";
        proxy_redirect off;
    }

    location /i {
        root /var/www/example.domain.tld;
    }

    include "/etc/nginx/snippets/ssl/example.domain.tld.conf";
}
